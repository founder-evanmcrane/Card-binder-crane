<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Binder">
<title>Card Binder</title>
<style>
:root{--bg:#e9edf1;--surface:#fff;--text:#0f1b2d;--muted:#5a6676;--line:#cfd6de;--accent:#1b6b45;--on-accent:#fff;--bad:#a8321f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--surface:#172233;--text:#e8edf3;--muted:#98a5b6;--line:#2a384c;--accent:#4fb383;--on-accent:#062015;--bad:#ff8a75;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1622;--surface:#172233;--text:#e8edf3;--muted:#98a5b6;--line:#2a384c;--accent:#4fb383;--on-accent:#062015;--bad:#ff8a75;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1,h2,h3{font-family:Rockwell,"Roboto Slab",Georgia,serif;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.25rem;margin:14px 0 2px}h3{font-size:1rem;margin-bottom:8px}
.muted{color:var(--muted);font-size:.9rem;margin:2px 0}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%;margin-top:14px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
label input,label select,label textarea{margin-top:4px;color:var(--text);font-size:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
.sum div{padding:10px 12px;border-left:1px solid var(--line)}.sum div:first-child{border-left:0}
.sum b{display:block;font:700 1.15rem Rockwell,Georgia,serif;font-variant-numeric:tabular-nums}
.sum span{font-size:.78rem;color:var(--muted)}
.row{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer}
.row img,.row .ph{width:52px;height:72px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.row .t{font-weight:600}.row .v{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.tile{display:flex;align-items:center;justify-content:center;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:10px;background:var(--surface);color:var(--muted);text-align:center;cursor:pointer;overflow:hidden;font-size:.9rem}
.tile img,.photos img{width:100%;height:auto;object-fit:contain;border-radius:10px;display:block}
.tile.has{aspect-ratio:auto;border-style:solid}
.gc .chk{position:absolute;right:4px;top:4px;background:#c28a00;color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:6px}
.tile input{display:none}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.big{font:700 1.8rem Rockwell,Georgia,serif;font-variant-numeric:tabular-nums}
.hist{list-style:none;padding:0;margin:8px 0;font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:.92rem}
.inline{display:flex;gap:8px}.inline input:first-child{max-width:120px}
.links a{display:inline-block;margin:0 8px 6px 0;color:var(--accent);font-weight:600}
.pos{color:var(--accent)}.neg{color:var(--bad)}
textarea#csv{margin-top:8px;height:120px;font:12px/1.3 ui-monospace,Menlo,monospace}
details{margin-top:22px}summary{cursor:pointer;color:var(--muted)}
.warn{background:var(--surface);border:1.5px solid var(--bad);border-radius:10px;padding:10px;margin-bottom:12px;font-size:.9rem}
.unsure{color:#b07a00}.unsure input{border-color:#c28a00}
.note{border-color:var(--accent)}
#scan{margin:8px 0 0}
.grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gc{display:block;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.gc .im{position:relative;aspect-ratio:5/7;border-radius:8px;overflow:hidden;background:var(--line);border:1.5px solid var(--line)}
.gc img{width:100%;height:100%;object-fit:cover;display:block}
.gc .tag{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.gc .n{font-weight:600;font-size:.82rem;line-height:1.2;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .s{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{padding:6px 12px;font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<p class="muted" id="ver" style="text-align:center;padding:0 16px 24px"></p>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null||n===''||isNaN(n)?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const title=c=>[c.year,c.set,c.player,c.number?'#'+String(c.number).toUpperCase():'',c.parallel].filter(Boolean).join(' ')||'Untitled card';
const fmtS=n=>n>=100?'$'+Math.round(n):'$'+(+n).toFixed(2).replace(/\.00$/,'');
const latest=c=>c.values&&c.values.length?c.values[c.values.length-1].v:null;
const S={view:'list',id:null,q:'',arm:false,warn:'',note:'',scan:'',pc:null};
let db=null,cards=[],draft={},scanBusy=false,scanAgain=false,batchBusy=false;
const APP='v7 · Nov 23, 2026 · Worker',ai={on:false,max:4,why:'checking',used:null,limit:null};

/* ---- storage: IndexedDB with in-memory fallback ---- */
function openDB(){return new Promise((res,rej)=>{setTimeout(()=>rej(new Error('timeout')),5000);try{const r=indexedDB.open('cardbinder',1);r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}})}
function tx(mode,fn){return new Promise((res,rej)=>{setTimeout(()=>rej(new Error('timeout')),8000);const t=db.transaction('cards',mode),r=fn(t.objectStore('cards'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))})}
async function persist(c,keep){if(!keep){c.updatedAt=new Date().toISOString();c.createdAt=c.createdAt||new Date(c.added||Date.now()).toISOString()}const i=cards.findIndex(x=>x.id===c.id);i<0?cards.push(c):cards[i]=c;if(!db)return false;try{await tx('readwrite',s=>s.put(c));return true}catch(e){return false}}
async function remove(id){cards=cards.filter(c=>c.id!==id);if(db){try{await tx('readwrite',s=>s.delete(id))}catch(e){}}}

/* ---- photos: shrink before storing ---- */
async function shrink(file,max=1100){
  let im;try{im=await createImageBitmap(file)}catch(_){im=await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>res(i);i.src=fr.result};fr.readAsDataURL(file)})}
  const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(im.close)im.close();return c.toDataURL('image/jpeg',.82)}

/* ---- scan photos with Claude ---- */
const FIELDS=['player','year','set','number','parallel','serial','type','grader','grade'];
function dataToBlob(u){const [h,b]=u.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
function syncDraft(){document.querySelectorAll('#app [name]').forEach(el=>draft[el.name]=el.value.trim())}
function paintScan(){const el=$('#scan');if(el)el.textContent=S.scan}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* ---- Worker backend: scan and price routes live in the Worker ---- */
const asData=async x=>x.type==='image/jpeg'&&x.size<1.5e6?await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(x)}):await shrink(x,1600);
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.status===429){const j=await r.json().catch(()=>({}));throw{code:j.error==='daily_limit'?'limit':'busy'}}
  if(r.status===401||r.status===403)throw{code:'signin'};
  if(!r.ok)throw new Error('ai '+r.status);
  return await r.json()}
const SCANERR={signin:'Sign-in needed. Reload the page to sign in.',limit:'Daily scan limit reached. Try again tomorrow.',busy:'Too many scans right now. Try again in a minute.'};
const AIWHY={ready:'Scanning is on',checking:'Checking scanning…',signin:'Scanning is off: sign-in needed. Reload the page.',access_not_set:'Scanning is off: the Worker has no Access settings yet.',no_key:'Scanning is off: no AI is connected to the Worker yet.',limit:'Scanning is off: daily limit reached.'};
async function checkAI(){
  try{const r=await fetch('/api/status');const j=await r.json();ai.on=j.ready===true;ai.price=j.price===true;ai.why=j.ready?'ready':(j.reason||'signin');ai.used=j.used;ai.limit=j.limit}
  catch(_){ai.on=false;ai.why='signin'}
  paintAI()}
function paintAI(){
  const t=(AIWHY[ai.why]||AIWHY.signin)+(ai.on&&ai.limit?' ('+ai.used+' of '+ai.limit+' used today)':'');
  document.querySelectorAll('.aistat').forEach(e=>{e.innerHTML=esc(t)+(ai.on||ai.why==='checking'?'':' <a href="#" data-act="recheck">Check again</a>')});
  const b=$('#batchslot');if(b&&b.dataset.on!==String(ai.on)){b.dataset.on=String(ai.on);b.innerHTML=batchBox()}
  const s=$('#scanbtn');if(s)s.hidden=!(ai.on&&(draft.front||draft.back));
  const p=$('#pcslot');if(p&&p.dataset.on!==String(ai.on)){p.dataset.on=String(ai.on);const c=cards.find(x=>x.id===S.id);if(c)p.innerHTML=pcHTML(c)}}
/* ---- restore: check the whole file first, then confirm ---- */
let pend=null;
const okImg=s=>!s||(typeof s==='string'&&/^data:image[/](jpeg|png|webp);base64,/.test(s)&&/^[A-Za-z0-9+/=]*$/.test(s.slice(s.indexOf(',')+1)));
const okCard=c=>!!c&&typeof c==='object'&&/^[A-Za-z0-9_-]{8,64}$/.test(String(c.id))&&okImg(c.front)&&okImg(c.back)&&(c.values==null||Array.isArray(c.values));
async function restorePreview(file){
  const m=$('#bkmsg');pend=null;
  let j;try{j=JSON.parse(await file.text())}catch(_){m.textContent='That file is not a Card Binder backup (it could not be read).';return}
  const L=Array.isArray(j)?j:j&&j.cards;
  if(!Array.isArray(L)||(j.app&&j.app!=='card-binder')){m.textContent='That file is not a Card Binder backup.';return}
  if(j.v>1||j.schemaVersion>1){m.textContent='That backup is from a newer version of the app. Nothing was changed.';return}
  const add=[];let same=0,diff=0,bad=0;
  for(const c of L){
    if(!okCard(c)){bad++;continue}
    const cur=cards.find(x=>x.id===c.id);
    if(!cur)add.push(c);else if(JSON.stringify(cur)===JSON.stringify(c))same++;else diff++}
  pend=add;
  m.innerHTML=esc(add.length+' new, '+same+' already here, '+diff+' different from your current copy (kept as is), '+bad+' skipped as invalid.')+(add.length?'<br><button class="btn" data-act="rgo" style="margin-top:8px">Restore '+add.length+' new card'+(add.length>1?'s':'')+'</button>':'')}
async function readCard(blobs,deep){
  const body={images:await Promise.all(blobs.map(asData)),deep:!!deep};
  try{return await api('/api/scan',body)}
  catch(e){if(e&&e.code==='busy'){await wait(8000);return await api('/api/scan',body)}throw e}
}
function applyRead(d,r,ow){
  const got=[];FIELDS.forEach(f=>{let v=String(r[f]==null?'':r[f]).trim();if(f==='type')v=/grad/i.test(v)?'graded':v?'raw':'';if(v&&(ow||!d[f])){d[f]=v;got.push(f)}});
  const ex=[r.cert?'Cert #'+r.cert:'',r.autograph?'Autograph':''].filter(Boolean).join(', ');if(ex&&!d.notes){d.notes=ex;got.push('notes')}
  d._unsure=Array.isArray(r.unsure)?r.unsure:[];d._low=r.confidence==='low';return got;
}
function paintForm(){
  if(S.view!=='form')return;
  document.querySelectorAll('#app [name]').forEach(el=>{if(draft[el.name]!=null&&el.value!==String(draft[el.name]))el.value=draft[el.name]});
  const g=$('#gr');if(g)g.hidden=draft.type!=='graded';
  document.querySelectorAll('#app label[data-f]').forEach(l=>l.classList.toggle('unsure',(draft._unsure||[]).includes(l.dataset.f)));
  paintScan();
}
async function scan(overwrite){
  if(!ai.on)return;if(scanBusy){scanAgain=true;return}
  const imgs=[draft.front,draft.back].filter(Boolean).map(dataToBlob);if(!imgs.length)return;
  scanBusy=true;S.scan='Reading your photos…';paintScan();
  try{
    const r=await readCard(imgs,overwrite);
    if(S.view==='form')syncDraft();
    const got=applyRead(draft,r,overwrite);
    S.scan=(got.length?'Filled in '+got.length+' fields.':'Nothing new to fill in.')+(draft._unsure.length||draft._low?' Check the highlighted ones.':'');
  }catch(e){S.scan=SCANERR[e&&e.code]||'Could not read that photo. Try a clearer one, or type the details.'}
  scanBusy=false;paintForm();
  if(scanAgain){scanAgain=false;scan(false)}
}
/* ---- values without screenshots: copy cards to a chat with Claude, paste the answer back ---- */
const VREQ=`Card Binder value request. For each baseball card below, use web search to find what it recently sold for (eBay sold listings, SportsCardsPro or PriceCharting, Card Ladder, 130point). Match the exact card: year, set, card number, parallel, print run, and raw versus graded. Treat raw cards as raw. Never mix in other parallels or grades. Give a typical sold price in USD, a low and a high, how many recent sales you used, and your confidence (high, medium or low). If there are too few sales, say low confidence and use null for value instead of guessing. Reply with a short summary, then one JSON code block shaped like [{"id":"copy the id exactly","value":0,"low":0,"high":0,"sales":0,"confidence":"medium","basis":"short source note"}]. Cards:\n`;
function valueRequest(){
  const old=Date.now()-30*864e5;
  const todo=cards.filter(c=>{const v=(c.values||[]).slice(-1)[0];return !v||Date.parse(v.d)<old});
  const L=todo.slice(0,25).map(c=>{const o={id:c.id,player:c.player,year:c.year,set:c.set,number:c.number,parallel:c.parallel,serial:c.serial,type:c.type,grader:c.grader,grade:c.grade,notes:c.notes};Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o});
  return {n:L.length,of:todo.length,text:VREQ+JSON.stringify(L)};
}
async function applyValues(txt){
  const f=String(txt).match(/```(?:json)?\s*([\s\S]*?)```/),src=f?f[1]:String(txt),m=src.match(/\[[\s\S]*\]/);
  if(!m)throw new Error('No values found in that text.');
  let L;try{L=JSON.parse(m[0])}catch(e){throw new Error('Could not read that. Paste the whole JSON block from Claude.')}
  const today=new Date().toISOString().slice(0,10);let ok=0,skip=0;
  for(const o of L){
    const c=o&&cards.find(x=>x.id===o.id),v=o&&parseFloat(o.value);
    if(!c||!(v>0)){skip++;continue}
    const note=[o.confidence?o.confidence+' confidence':'',o.low!=null&&o.high!=null&&+o.high>0?'range '+fmt(+o.low)+' to '+fmt(+o.high):'',o.sales?o.sales+' sales':'',o.basis||''].filter(Boolean).join(', ').slice(0,140);
    c.values=(c.values||[]).concat({d:today,v:Math.round(v*100)/100,n:'Claude: '+note});
    await persist(c);ok++;
  }
  return {ok,skip};
}
const valuesBox=()=>`<details class="box" style="margin:0 0 12px"><summary style="color:var(--text);font-weight:600">Get values without screenshots</summary><p class="muted" style="margin-top:8px">Copy your cards, paste them into a chat with Claude (it looks up recent sold prices), then copy Claude’s reply and paste it back here. Cards with a value from the last 30 days are left out.</p><button class="btn ghost" data-act="vcopy">1. Copy cards for Claude</button><textarea id="vout" readonly hidden rows="3" style="margin-top:8px"></textarea><textarea id="vin" rows="3" placeholder="2. Paste Claude’s reply here" style="margin-top:8px"></textarea><button class="btn ghost" data-act="vapply" style="margin-top:8px">3. Apply values</button><p class="muted" id="vmsg" style="margin-top:8px"></p></details>`;
const batchBox=()=>ai.on?`<div class="box" style="margin:0 0 12px"><label class="btn ghost" style="text-align:center;margin:0;color:var(--accent);font-size:1rem">Add many cards from photos<input type="file" accept="image/*" multiple hidden data-batch="1"></label><select id="bmode" style="margin-top:8px"><option value="2">Two photos per card: front, then back</option><option value="1">One photo per card: front only</option></select><p class="muted" id="bmsg" style="margin-top:8px">Take the photos in order. Each card is read and added for you, and unsure ones are marked Check.</p></div>`:'';
async function batchAdd(files,per){
  if(batchBusy||!ai.on)return;batchBusy=true;
  const fs=[...files].sort((a,b)=>(a.lastModified-b.lastModified)||a.name.localeCompare(b.name)),groups=[];
  for(let i=0;i<fs.length;i+=per)groups.push(fs.slice(i,i+per));
  const say=t=>{const m=$('#bmsg');if(m)m.textContent=t};let next=0,done=0,review=0;
  say('Reading '+groups.length+' card'+(groups.length>1?'s':'')+'…');
  const worker=async()=>{
    while(next<groups.length){
      const idx=next++,g=groups[idx];
      try{
        const urls=await Promise.all(g.map(f=>shrink(f)));
        const c={id:uid(),added:Date.now()+idx,type:'raw',front:urls[0],back:urls[1]||'',values:[]};
        try{applyRead(c,await readCard(urls.map(dataToBlob),false),true);c.review=!!(c._unsure.length||c._low||!c.player)}catch(e){c.review=true}
        delete c._unsure;delete c._low;if(c.type!=='graded')c.type='raw';
        await persist(c);if(c.review)review++;
      }catch(e){review++}
      done++;say('Done '+done+' of '+groups.length+'…');if(S.view==='list')fillList();
    }
  };
  await Promise.all([worker(),worker()]);
  say('Added '+groups.length+' card'+(groups.length>1?'s':'')+(review?'. '+review+' marked Check need a quick look.':'.'));
  batchBusy=false;
}

/* ---- rotate photos, backup and restore ---- */
const rotBtn=s=>draft[s]?`<button class="btn ghost sm" data-act="rot" data-side="${s}">Rotate</button>`:'';
function rotate(u){return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(im,0,0);res(c.toDataURL('image/jpeg',.82))};im.src=u})}
async function saveFile(name,text,share){
  const blob=new Blob([text],{type:'application/json'});
  if(share){const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ---- price check from marketplace screenshots ---- */
const ctxPC=x=>(x.note?' '+esc(x.note):'')+((x.rel||[]).length?'<br>Other versions of this card sold for '+fmt(x.rel[0])+' to '+fmt(x.rel[x.rel.length-1])+' ('+x.rel.length+' listings). Those are not averaged.':'');
function pcHTML(c){
  if(!ai.on||!ai.price)return '';
  const r=S.pc&&S.pc.id===c.id?S.pc:{};let out='';
  if(r.busy)out='<p class="muted">Reading the screenshot…</p>';
  else if(r.err)out=`<p class="muted">${esc(r.err)}</p>`;
  else if(r.res){const x=r.res;out=x.n?`<div class="big">${fmt(x.avg)}</div><p class="muted">Average of ${x.n} matching ${x.kind==='active'?'asking prices (not actual sales)':'sold listings'} · median ${fmt(x.med)} · range ${fmt(x.lo)} to ${fmt(x.hi)}${x.skipped?' · '+x.skipped+' skipped as different cards':''}<br>Used: ${x.used.map(fmt).join(', ')}${x.n<3?'<br>Only a few matches, so treat this as rough.':''}${ctxPC(x)}</p><button class="btn" data-act="usepc">Save as value</button>`:'<p class="muted">No exact matches in that screenshot.'+ctxPC(x)+'</p>'}
  return `<div class="box"><h3>Price check from a screenshot</h3><p class="muted">Tap “Sold on eBay” above, screenshot the results, then add the screenshot here. I’ll average the listings that match this card.</p><label class="btn ghost" style="text-align:center;color:var(--accent);font-size:1rem">Add screenshot<input type="file" accept="image/*" multiple hidden data-pc="1"></label>${out}</div>`;
}
async function runPC(files){
  const c=cards.find(x=>x.id===S.id);if(!c||!ai.on)return;S.pc={id:c.id,busy:true};detailView();
  try{
    const r=await api('/api/price',{card:{title:title(c),serial:c.serial||'',type:c.type||'raw',grader:c.grader||'',grade:c.grade||''},images:await Promise.all(files.map(asData))});
    const L=(r.listings||[]).map(x=>({p:parseFloat(String(x.price).replace(/[^0-9.]/g,'')),same:x.same===true,rel:x.related===true})).filter(x=>x.p>0);
    const ok=L.filter(x=>x.same).map(x=>x.p).sort((a,b)=>a-b),n=ok.length;
    S.pc={id:c.id,res:{n,avg:n?ok.reduce((a,b)=>a+b,0)/n:0,med:n?(n%2?ok[(n-1)/2]:(ok[n/2-1]+ok[n/2])/2):0,lo:ok[0],hi:ok[n-1],skipped:L.length-n,kind:r.kind,used:ok,note:String(r.note||''),rel:L.filter(x=>x.rel&&!x.same).map(x=>x.p).sort((a,b)=>a-b)}};
  }catch(e){S.pc={id:c.id,err:SCANERR[e&&e.code]||'Could not read that screenshot. Try a clearer one.'}}
  if(S.view==='detail'&&S.id===c.id)detailView();
}

/* ---- views ---- */
const warnBox=()=>(S.warn?`<div class="warn">${esc(S.warn)}</div>`:'')+(S.note?`<div class="warn note">${esc(S.note)}</div>`:'');
function listView(){
  $('#app').innerHTML=`<header><h1>Card Binder</h1><button class="btn" data-act="new">Add card</button></header>${warnBox()}
  <div id="sum"></div><p class="muted aistat"></p><div id="batchslot" data-on="${ai.on}">${batchBox()}</div>${valuesBox()}<input id="q" type="search" placeholder="Search player, set, year, parallel…" value="${esc(S.q)}">
  <div id="list"></div>
  <details><summary>Back up and restore</summary><p class="muted">Your cards live only on this device. Save a backup file (photos included) now and then. Restore adds any cards from a backup that are not already here.</p>
  <div class="inline"><button class="btn ghost" data-act="bk">Save backup</button><button class="btn ghost" data-act="bks">Share</button><label class="btn ghost" style="text-align:center;margin:0;color:var(--accent);font-size:1rem">Restore<input type="file" hidden data-restore="1"></label></div><p class="muted" id="bkmsg"></p>
  <button class="btn ghost" data-act="csv">Show CSV (no photos)</button><textarea id="csv" readonly hidden></textarea></details>`;
  fillList();paintAI();
}
function fillList(){
  const q=S.q.toLowerCase().trim();
  const rows=cards.filter(c=>!q||[c.year,c.set,c.player,c.number,c.parallel,c.grader,c.grade,c.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.added-a.added);
  const cost=cards.reduce((a,c)=>a+(+c.cost||0),0);
  const valued=cards.filter(c=>latest(c)!=null),val=valued.reduce((a,c)=>a+latest(c),0),pr=valued.filter(c=>c.cost!==''&&c.cost!=null),gain=pr.reduce((a,c)=>a+latest(c)-(+c.cost),0);
  $('#sum').innerHTML=`<div class="sum"><div><b>${cards.length}</b><span>Cards</span></div><div><b>${cost?fmt(cost):'—'}</b><span>Paid</span></div><div><b>${valued.length?fmt(val):'—'}</b><span>Value</span></div></div>`
    +(pr.length?`<p class="muted" style="margin:-4px 0 10px">Gain where you entered a price paid: <span class="${gain>=0?'pos':'neg'}">${gain>=0?'+':''}${fmt(gain)}</span></p>`:'');
  $('#list').className=rows.length?'grid-cards':'';
  $('#list').innerHTML=rows.length?rows.map(c=>`<button class="gc" data-act="open" data-id="${c.id}"><div class="im">${c.review?'<span class="chk">Check</span>':''}${c.front?`<img src="${c.front}" alt="">`:''}${latest(c)!=null?`<span class="tag">${fmtS(latest(c))}</span>`:''}</div><div class="n">${esc(c.player||title(c))}</div><div class="s">${esc([c.year,c.set].filter(Boolean).join(' '))}</div><div class="s">${esc([c.parallel,c.type==='graded'?(c.grader||'')+' '+(c.grade||''):''].filter(Boolean).join(' · '))}</div></button>`).join(''):`<p class="muted" style="margin-top:20px">${cards.length?'No cards match that search.':'No cards yet. Tap “Add card”, then photograph the front and back.'}</p>`;
}
function tile(side,label){return `<label class="tile${draft[side]?' has':''}" style="margin:0">${draft[side]?`<img src="${draft[side]}" alt="${label}">`:`<span>${label}<br>Tap to take or choose a photo</span>`}<input type="file" accept="image/*" data-side="${side}"></label>`}
function formView(){
  const c=draft,f=(n,l,extra='')=>`<label data-f="${n}" class="${(c._unsure||[]).includes(n)?'unsure':''}">${l}<input name="${n}" value="${esc(c[n])}" ${extra}></label>`;
  $('#app').innerHTML=`<header><button class="btn ghost" data-act="back">Back</button><h1>${c.id?'Edit card':'New card'}</h1><span></span></header>${warnBox()}<p class="muted aistat"></p>
  <div class="photos"><div>${tile('front','Front')}${rotBtn('front')}</div><div>${tile('back','Back')}${rotBtn('back')}</div></div>
  <p class="muted" id="scan">${esc(S.scan||(c.front||c.back?(ai.on?'Tap “Scan again” to re-read them more carefully.':''):(ai.on?'Add a photo and I’ll fill in the details.':'Tip: lay the card flat in even light.')))}</p><button class="btn ghost" id="scanbtn" data-act="scan" ${ai.on&&(c.front||c.back)?'':'hidden'}>Scan again, more carefully</button>
  ${f('player','Player')}
  <div class="grid">${f('year','Year','inputmode="numeric"')}${f('number','Card number')}</div>
  ${f('set','Brand and set (e.g. Topps Chrome)')}
  <div class="grid">${f('parallel','Parallel or variation')}${f('serial','Serial number (e.g. 087/250)')}</div>
  <label>Raw or graded<select name="type"><option value="raw" ${c.type!=='graded'?'selected':''}>Raw</option><option value="graded" ${c.type==='graded'?'selected':''}>Graded slab</option></select></label>
  <div class="grid" id="gr" ${c.type==='graded'?'':'hidden'}>${f('grader','Grader (PSA, BGS…)')}${f('grade','Grade')}</div>
  <div class="grid">${f('cost','Amount paid ($)','inputmode="decimal"')}<label>Date acquired<input type="date" name="acquired" value="${esc(c.acquired)}"></label></div>
  <label>Notes<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>
  <button class="btn block" data-act="save">Save card</button>`;paintAI()
}
function detailView(){
  const c=cards.find(x=>x.id===S.id);if(!c){S.view='list';return render()}
  const v=latest(c),gain=v!=null&&c.cost!==''&&c.cost!=null?v-c.cost:null;
  const pr=(c.serial||'').split('/')[1],q=encodeURIComponent([c.year,String(c.set||'').replace(/[()'"]/g,' '),c.player,c.number,c.parallel,pr?'/'+pr:'',c.type==='graded'?c.grader+' '+c.grade:'','-lot'].filter(Boolean).join(' ').replace(/\s+/g,' '));
  $('#app').innerHTML=`<header><button class="btn ghost" data-act="back">Back</button><button class="btn ghost" data-act="edit">Edit</button></header>${warnBox()}
  <div class="photos">${c.front?`<img src="${c.front}" alt="Front">`:'<div class="tile">No front photo</div>'}${c.back?`<img src="${c.back}" alt="Back">`:'<div class="tile">No back photo</div>'}</div>
  <h2>${esc(title(c))}</h2>
  <p class="muted">${c.type==='graded'?esc((c.grader||'')+' '+(c.grade||'')):'Raw'}${c.serial?' · '+esc(c.serial):''}</p>
  ${c.notes?`<p class="muted">${esc(c.notes)}</p>`:''}
  <div class="box"><h3>Value</h3><div class="big">${fmt(v)}</div>
  <p class="muted">Paid ${fmt(c.cost)}${c.acquired?' on '+esc(c.acquired):''}${gain!=null?` · <span class="${gain>=0?'pos':'neg'}">${gain>=0?'+':''}${fmt(gain)}</span>`:''}</p>
  <ul class="hist">${(c.values||[]).slice().reverse().map(x=>`<li><span>${esc(x.d)}${x.n?' · '+esc(x.n):''}</span><b>${fmt(x.v)}</b></li>`).join('')}</ul>
  <div class="inline"><input id="nv" inputmode="decimal" placeholder="Value $"><input id="nn" placeholder="Source (optional)"><button class="btn" data-act="addval">Save</button></div></div>
  <div class="box links"><h3>Look up recent sales</h3>
  <a target="_blank" rel="noopener" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1">Sold on eBay</a>
  <a target="_blank" rel="noopener" href="https://www.ebay.com/sch/i.html?_nkw=${q}">For sale on eBay</a>
  <p class="muted">Match the exact parallel and grade, then save what you find as a new value above. Each save keeps your value history.</p></div>
  <div id="pcslot" data-on="${ai.on}">${pcHTML(c)}</div>
  <button class="btn danger block" data-act="del">${S.arm?'Tap again to delete for good':'Delete card'}</button>`;
}
function render(){S.view==='list'?listView():S.view==='form'?formView():detailView()}

/* ---- actions ---- */
function csvText(){const h=['player','year','set','number','parallel','serial','type','grader','grade','paid','acquired','latest_value','notes'],q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return [h.join(',')].concat(cards.map(c=>[c.player,c.year,c.set,c.number,c.parallel,c.serial,c.type,c.grader,c.grade,c.cost,c.acquired,latest(c),c.notes].map(q).join(','))).join('\n')}
const guard=fn=>async e=>{try{await fn(e)}catch(err){S.warn='Something went wrong: '+((err&&err.message)||err);try{render()}catch(_){}}};
document.addEventListener('click',guard(async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='recheck'){e.preventDefault();ai.why='checking';paintAI();await checkAI()}
  else if(a==='rgo'){const m=$('#bkmsg');let ok=0,fail=0;for(const c of pend||[]){if(await persist(c,true))ok++;else fail++}pend=null;m.textContent='Restored '+ok+' card'+(ok===1?'':'s')+(fail?'. '+fail+' could not be saved because storage refused them.':'.');fillList()}
  else if(a==='new'){draft={type:'raw'};S.view='form';S.warn='';S.note='';S.scan='';render()}
  else if(a==='open'){S.id=b.dataset.id;S.pc=null;S.view='detail';S.arm=false;S.warn='';S.note=(cards.find(x=>x.id===b.dataset.id)||{}).review?'Added in a batch. Tap Edit to check the details, then Save.':'';render()}
  else if(a==='back'){S.view='list';S.arm=false;S.warn='';S.note='';render()}
  else if(a==='edit'){draft={...cards.find(c=>c.id===S.id)};S.view='form';S.note='';S.scan='';render()}
  else if(a==='rot'){syncDraft();draft[b.dataset.side]=await rotate(draft[b.dataset.side]);formView()}
  else if(a==='scan'){syncDraft();scan(true)}
  else if(a==='vcopy'){const r=valueRequest(),m=$('#vmsg'),t=$('#vout');
    if(!r.n){m.textContent='Every card already has a recent value.';return}
    t.value=r.text;t.hidden=false;t.select();let ok=false;try{await navigator.clipboard.writeText(r.text);ok=true}catch(_){}
    m.textContent=(ok?'Copied ':'Select and copy the text above: ')+r.n+(r.of>r.n?' of '+r.of:'')+' cards. Paste it into a chat with Claude.'+(r.of>r.n?' Apply the values, then copy again for the next group.':'')}
  else if(a==='vapply'){const m=$('#vmsg');try{const r=await applyValues($('#vin').value);m.textContent='Updated '+r.ok+' card'+(r.ok===1?'':'s')+(r.skip?'. Skipped '+r.skip+' with no usable value.':'.');$('#vin').value='';fillList()}catch(e){m.textContent=e.message||'Could not read that.'}}
  else if(a==='bk'||a==='bks'){const m=$('#bkmsg');try{const now=new Date().toISOString();await saveFile('card-binder-backup-'+now.slice(0,10)+'.json',JSON.stringify({app:'card-binder',v:1,schemaVersion:1,appVersion:APP,saved:now,exportedAt:now,count:cards.length,cards}),a==='bks');m.textContent=(a==='bks'?'Backup shared: ':'Backup saved: ')+cards.length+' cards.'}catch(e){m.textContent=e&&e.code==='declined'?'Backup cancelled.':'Could not save a backup file here.'}}
  else if(a==='save'){
    syncDraft();
    if(!draft.player&&!draft.set){S.warn='Add at least a player or a set name.';return formView()}
    delete draft._unsure;delete draft._low;draft.review=false;
    draft.id=draft.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
    draft.added=draft.added||Date.now();draft.values=draft.values||[];
    const p=persist(draft);S.id=draft.id;S.view='detail';S.warn='';S.note='Saving…';render();
    const ok=await p;if(S.view==='detail'&&S.id===draft.id){S.note=ok?'Saved on this device.':'';S.warn=ok?'':'Saved for now, but this device’s storage refused it. The card will disappear when you close the page.';detailView()}}
  else if(a==='addval'){
    const v=parseFloat($('#nv').value);if(isNaN(v))return;const c=cards.find(x=>x.id===S.id);
    c.values=(c.values||[]).concat({d:new Date().toISOString().slice(0,10),v,n:$('#nn').value.trim()});await persist(c);render()}
  else if(a==='usepc'){const x=S.pc&&S.pc.res,c=cards.find(k=>k.id===S.id);if(!x||!c)return;
    c.values=(c.values||[]).concat({d:new Date().toISOString().slice(0,10),v:Math.round(x.avg*100)/100,n:'eBay '+(x.kind==='active'?'asking':'sold')+' avg of '+x.n});S.pc=null;await persist(c);render()}
  else if(a==='del'){if(!S.arm){S.arm=true;return detailView()}await remove(S.id);S.view='list';S.arm=false;render()}
  else if(a==='csv'){const t=$('#csv');t.value=csvText();t.hidden=false;t.select();try{await navigator.clipboard.writeText(t.value)}catch(_){}}
}));
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;fillList()}});
document.addEventListener('change',guard(async e=>{
  const t=e.target;
  if(t.name==='type'){draft.type=t.value;$('#gr').hidden=t.value!=='graded'}
  else if(t.dataset.restore&&t.files[0]){await restorePreview(t.files[0]);t.value=''}
  else if(t.dataset.batch&&t.files.length){const per=Math.max(1,Math.min(+(($('#bmode')||{}).value)||2,ai.max));batchAdd(t.files,per).catch(()=>{batchBusy=false})}
  else if(t.dataset.pc&&t.files.length){runPC([...t.files].slice(0,ai.max))}
  else if(t.dataset.side&&t.files[0]){
    syncDraft();
    try{draft[t.dataset.side]=await shrink(t.files[0])}catch(_){S.warn='That photo could not be read. Try another.'}
    formView();scan(false)}
}));

/* ---- start ---- */
(async()=>{
  try{db=await openDB();cards=await tx('readonly',s=>s.getAll())||[];try{navigator.storage.persist()}catch(_){}}
  catch(e){db=null;S.warn='This browser blocked storage, so cards will be lost when you close the page.'}
  render();
  $('#ver').textContent='Card Binder '+APP+' · data format v1';checkAI();
})();
</script>
</body>
</html>
